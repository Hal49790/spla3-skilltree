<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spla3 SKILL TREE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
.app{display:flex;height:100vh}
.sidebar{width:330px;min-width:330px;background:#11182b;border-right:1px solid #29334d;padding:20px;overflow-y:auto;z-index:10}
.title{font-size:24px;font-weight:bold;margin-bottom:6px}
.subtitle{color:#8d9ab8;font-size:13px;margin-bottom:20px}
label{display:block;font-size:13px;color:#aeb9d2;margin:14px 0 7px}
input{width:100%;padding:11px;border-radius:9px;border:1px solid #34415f;background:#080d1a;color:#fff;font-size:15px;outline:none}
input:focus{border-color:#6d7cff}
button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:10px;background:#5967ff;color:#fff;font-weight:bold;font-size:14px;cursor:pointer;transition:.15s}
button:hover{background:#707cff;transform:translateY(-1px)}
button.secondary{background:#27324d}
button.secondary:hover{background:#34415f}
.seed-row{display:flex;gap:7px}.seed-row input{flex:1}.seed-row button{width:75px;margin-top:0}
.info{margin-top:18px;padding:13px;background:#0b1122;border-radius:10px;color:#8491ae;font-size:12px;line-height:1.7}
.status{margin-top:14px;color:#8f9dbc;font-size:12px;line-height:1.5}
.canvas-area{position:relative;flex:1;overflow:hidden;background:radial-gradient(circle at center,#141e38 0%,#080d1a 70%)}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.dragging{cursor:grabbing}
.top-info{position:absolute;right:18px;top:18px;background:rgba(12,18,35,.88);border:1px solid #2c3855;padding:10px 14px;border-radius:10px;font-size:12px;color:#aeb9d2;backdrop-filter:blur(8px)}
.skill-detail{position:absolute;right:18px;bottom:18px;width:280px;background:rgba(12,18,35,.94);border:1px solid #34415f;border-radius:12px;padding:16px;display:none;backdrop-filter:blur(10px)}
.skill-detail.show{display:block}.skill-detail h2{margin:0 0 8px;font-size:19px}.skill-detail p{margin:0;color:#9aa7c1;font-size:12px;line-height:1.6}
.seed-badge{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:6px;background:#1d2741;color:#aeb9d2;font-size:11px}
@media(max-width:700px){
body{overflow:hidden;touch-action:none}
.app{display:block;height:100dvh}
.sidebar{position:absolute;left:0;right:0;top:0;width:auto;min-width:0;height:auto;max-height:42dvh;padding:12px;background:rgba(17,24,43,.96);border:0;border-bottom:1px solid #29334d;overflow-y:auto;z-index:20;backdrop-filter:blur(10px)}
.title{font-size:20px;margin-bottom:2px}.subtitle{margin-bottom:8px}
label{margin:8px 0 5px}input{padding:9px;font-size:14px}button{padding:10px;margin-top:7px}
.info{display:none}.status{margin-top:8px}
.canvas-area{position:absolute;inset:0;width:100%;height:100dvh}
canvas{touch-action:none}
.top-info{top:auto;right:10px;bottom:10px;font-size:11px;padding:7px 10px;z-index:5}
.skill-detail{right:10px;left:10px;bottom:42px;width:auto;max-height:28dvh;overflow:auto;padding:12px;z-index:10}
}
@media(max-width:420px){.seed-row{gap:5px}.seed-row button{width:68px}.title{font-size:18px}.subtitle{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="title">Spla3 SKILL TREE</div>
  <div class="subtitle">Seedから同じスキルツリーを再現</div>

  <label>Seed</label>
  <div class="seed-row">
    <input id="seedInput" type="text" placeholder="例: 123456">
    <button id="randomSeedButton">ランダム</button>
  </div>

  <label>生成するスキル数</label>
  <input id="countInput" type="number" min="1" max="160" value="60">

  <button id="generateButton">スキルツリー生成</button>
  <button id="saveButton">取得状況を保存</button>
  <button id="exportPngButton">画像生成</button>
  <button id="resetButton" class="secondary">取得状態をリセット</button>

  <div class="status" id="status">スキルデータを読み込んでいます...</div>

  <div class="info">
    <b>Seedについて</b><br>
    同じSeed・同じ生成数なら、誰が開いても同じスキルツリーになります。<br><br>
    <b>操作方法</b><br>
    ・取得可能なスキルをクリック：取得<br>
    ・取得済みをもう一度クリック：状態変更<br>
    ・3回目のクリック：未取得<br>
    ・マウスドラッグ：移動<br>
    ・ホイール：ズーム<br>
    ・「保存」：このブラウザに取得状況を保存<br><br>
    <b>共有</b><br>
    SeedはURLにも保存されます。URLを共有すると同じツリーを開けます。
  </div>
</aside>

<main class="canvas-area">
  <canvas id="canvas"></canvas>
  <div class="top-info" id="topInfo">0 / 0</div>
  <div class="skill-detail" id="skillDetail">
    <h2 id="detailName"></h2>
    <p id="detailText"></p>
  </div>
</main>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const seedInput=document.getElementById("seedInput");
const countInput=document.getElementById("countInput");
const generateButton=document.getElementById("generateButton");
const randomSeedButton=document.getElementById("randomSeedButton");
const saveButton=document.getElementById("saveButton");
const resetButton=document.getElementById("resetButton");
const exportPngButton=document.getElementById("exportPngButton");
const statusElement=document.getElementById("status");
const topInfo=document.getElementById("topInfo");
const skillDetail=document.getElementById("skillDetail");
const detailName=document.getElementById("detailName");
const detailText=document.getElementById("detailText");

const HEX_SIZE=55;
const DIRECTIONS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];

let allSkills=[];
let hexes=[];
let zoom=1,offsetX=0,offsetY=0;
let dragging=false,lastMouseX=0,lastMouseY=0;
let dataLoaded=false;

function hashSeed(str){
  let h=2166136261>>>0;
  for(let i=0;i<str.length;i++){
    h^=str.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return h>>>0;
}
function mulberry32(seed){
  return function(){
    let t=seed+=0x6D2B79F5;
    t=Math.imul(t^t>>>15,t|1);
    t^=t+Math.imul(t^t>>>7,t|61);
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function randomSeed(){
  const a=new Uint32Array(2);
  crypto.getRandomValues(a);
  return String((BigInt(a[0])<<32n|BigInt(a[1]))%1000000000000n);
}
function getSeed(){
  const s=seedInput.value.trim();
  return s||"123456";
}
function storageKey(){
  return "hex-skill-tree-progress-v1:"+getSeed()+":"+Number(countInput.value);
}
function hexKey(q,r){return `${q},${r}`}
function hexToPixel(q,r){
  return {x:HEX_SIZE*Math.sqrt(3)*(q+r/2),y:HEX_SIZE*1.5*r};
}
function getNeighbors(q,r){
  return DIRECTIONS.map(([dq,dr])=>({q:q+dq,r:r+dr}));
}

async function loadSkills(){
  try{
    const res=await fetch("./skills.json",{cache:"no-store"});
    if(!res.ok) throw new Error("skills.jsonを読み込めません");
    allSkills=await res.json();
    allSkills=allSkills.filter(x=>x&&x.filename&&x.name);
    countInput.max=allSkills.length;
    statusElement.textContent=`${allSkills.length}個のスキルを読み込みました。`;
    dataLoaded=true;
    loadFromUrl();
  }catch(e){
    statusElement.textContent="skills.jsonを読み込めませんでした。GitHubのwebフォルダを確認してください。";
    console.error(e);
  }
}

function loadFromUrl(){
  const p=new URLSearchParams(location.search);
  const urlSeed=p.get("seed");
  const urlCount=p.get("count");
  if(urlSeed) seedInput.value=urlSeed;
  else seedInput.value=randomSeed();
  if(urlCount){
    const n=Number(urlCount);
    if(Number.isInteger(n)&&n>=1&&n<=allSkills.length) countInput.value=n;
  }
  generateTree(true);
}

function updateUrl(){
  const url=new URL(location.href);
  url.searchParams.set("seed",getSeed());
  url.searchParams.set("count",String(Number(countInput.value)));
  history.replaceState(null,"",url);
}

function deterministicShuffle(items,rng){
  const a=[...items];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(rng()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function generateTree(fromUrl=false){
  if(!dataLoaded) return;
  let count=Math.max(1,Math.min(Number(countInput.value)||60,allSkills.length));
  countInput.value=count;
  const seed=getSeed();
  seedInput.value=seed;

  const rng=mulberry32(hashSeed(seed));
  const selected=deterministicShuffle(allSkills,rng).slice(0,count);

  hexes=[];
  const occupied=new Set();
  occupied.add(hexKey(0,0));
  hexes.push(makeHex(0,0,selected[0]));

  for(let i=1;i<selected.length;i++){
    const candidates=[];
    for(const h of hexes){
      for(const p of getNeighbors(h.q,h.r)){
        const k=hexKey(p.q,p.r);
        if(!occupied.has(k)) candidates.push(p);
      }
    }
    const unique=[];
    const seen=new Set();
    for(const p of candidates){
      const k=hexKey(p.q,p.r);
      if(!seen.has(k)){seen.add(k);unique.push(p);}
    }
    const pos=unique[Math.floor(rng()*unique.length)];
    occupied.add(hexKey(pos.q,pos.r));
    hexes.push(makeHex(pos.q,pos.r,selected[i]));
  }

  updateUrl();
  restoreProgress();
  centerTree();
  updateStatus();
  draw();

  if(!fromUrl) statusElement.textContent=`Seed「${seed}」で${count}個のツリーを生成しました。`;
}

function makeHex(q,r,skill){
  const image=new Image();
  image.src="./assets/skills/"+encodeURIComponent(skill.filename);
  return {q,r,name:skill.name,filename:skill.filename,image,obtained:false,state:0};
}

function centerTree(){
  if(!hexes.length){offsetX=offsetY=0;return}
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const h of hexes){
    const p=hexToPixel(h.q,h.r);
    minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);
  }
  offsetX=canvas.clientWidth/2-((minX+maxX)/2)*zoom;
  offsetY=canvas.clientHeight/2-((minY+maxY)/2)*zoom;
}

function worldToScreen(x,y){return{x:x*zoom+offsetX,y:y*zoom+offsetY}}

function isAvailable(hex){
  if(hex.obtained)return false;
  const obtained=hexes.filter(h=>h.obtained).length;
  if(obtained===0)return hex===hexes[0];
  return getNeighbors(hex.q,hex.r).some(p=>hexes.some(h=>h.q===p.q&&h.r===p.r&&h.obtained));
}

function drawHex(x,y,size,hex){
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/180*(60*i-30);
    const px=x+size*Math.cos(a),py=y+size*Math.sin(a);
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();

  ctx.fillStyle=hex.state===1?"#3e65ff":hex.state===2?"#b06cff":isAvailable(hex)?"#263b73":"#151d33";
  ctx.fill();

  if(hex.image.complete&&hex.image.naturalWidth){
    ctx.save();ctx.clip();
    const imageSize=size*1.58,iw=hex.image.naturalWidth,ih=hex.image.naturalHeight;
    const scale=Math.max(imageSize/iw,imageSize/ih);
    ctx.globalAlpha=hex.obtained?1:.78;
    ctx.drawImage(hex.image,x-iw*scale/2,y-ih*scale/2,iw*scale,ih*scale);
    ctx.restore();
  }

  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/180*(60*i-30);
    const px=x+size*Math.cos(a),py=y+size*Math.sin(a);
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
  if(hex.state===1){ctx.strokeStyle="#7f9aff";ctx.lineWidth=4}
  else if(hex.state===2){ctx.strokeStyle="#d8a8ff";ctx.lineWidth=4}
  else if(isAvailable(hex)){ctx.strokeStyle="#5f78ff";ctx.lineWidth=2.5}
  else{ctx.strokeStyle="#38445f";ctx.lineWidth=1.5}
  ctx.stroke();
  ctx.restore();
}

function drawConnections(){
  for(const h of hexes){
    const p1=worldToScreen(...Object.values(hexToPixel(h.q,h.r)));
    for(const p of getNeighbors(h.q,h.r)){
      const other=hexes.find(x=>x.q===p.q&&x.r===p.r);
      if(!other)continue;
      if(h.q>other.q||(h.q===other.q&&h.r>other.r))continue;
      const p2=worldToScreen(...Object.values(hexToPixel(other.q,other.r)));
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
      const connected=h.obtained&&other.obtained;
      ctx.strokeStyle=connected?"#637dff":"#26324d";
      ctx.lineWidth=connected?4:2;ctx.stroke();
    }
  }
}
function draw(){
  if(!canvas.clientWidth)return;
  ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
  drawConnections();
  for(const h of hexes){
    const p=hexToPixel(h.q,h.r),s=worldToScreen(p.x,p.y);
    drawHex(s.x,s.y,HEX_SIZE*zoom,h);
  }
}
function getHexAtMouse(x,y){
  for(let i=hexes.length-1;i>=0;i--){
    const h=hexes[i],p=hexToPixel(h.q,h.r),s=worldToScreen(p.x,p.y);
    const dx=x-s.x,dy=y-s.y;
    if(Math.hypot(dx,dy)<=HEX_SIZE*zoom)return h;
  }
  return null;
}
function updateStatus(){
  const obtained=hexes.filter(h=>h.obtained).length;
  topInfo.textContent=`${obtained} / ${hexes.length} 取得`;
}

function saveProgress(){
  const state=hexes.map(h=>({filename:h.filename,state:h.state,obtained:h.obtained}));
  localStorage.setItem(storageKey(),JSON.stringify(state));
  statusElement.textContent="取得状況をこのブラウザに保存しました。";
}
function restoreProgress(){
  try{
    const raw=localStorage.getItem(storageKey());
    if(!raw)return;
    const saved=JSON.parse(raw);
    for(const h of hexes){
      const x=saved.find(s=>s.filename===h.filename);
      if(x){h.state=x.state||0;h.obtained=!!x.obtained}
    }
  }catch(e){console.error(e)}
}
function resetProgress(){
  for(const h of hexes){h.state=0;h.obtained=false}
  localStorage.removeItem(storageKey());
  skillDetail.classList.remove("show");
  updateStatus();draw();
}

canvas.addEventListener("click",e=>{
  if(dragging)return;
  const r=canvas.getBoundingClientRect();
  const h=getHexAtMouse(e.clientX-r.left,e.clientY-r.top);
  if(!h){skillDetail.classList.remove("show");return}
  if(h.state===0){
    if(isAvailable(h)){h.state=1;h.obtained=true}
  }else if(h.state===1){h.state=2;h.obtained=true}
  else{h.state=0;h.obtained=false}
  updateStatus();draw();
  detailName.textContent=h.name;
  detailText.textContent=`${h.filename} / ${h.state===1?"取得済み":h.state===2?"使用済み":isAvailable(h)?"取得可能":"未取得"}`;
  skillDetail.classList.add("show");
});

function resizeCanvas(){
  const r=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;
  canvas.width=r.width*dpr;canvas.height=r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}
window.addEventListener("resize",resizeCanvas);


// Touch controls: one finger pans / taps; two fingers pinch-zoom.
let touchState={moved:false,pinch:false,startX:0,startY:0,lastX:0,lastY:0,startTime:0,startDistance:0,startZoom:1};

function touchDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function touchCenter(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}

canvas.addEventListener("touchstart",e=>{
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0];
    touchState={moved:false,pinch:false,startX:t.clientX,startY:t.clientY,lastX:t.clientX,lastY:t.clientY,startTime:Date.now(),startDistance:0,startZoom:zoom};
  }else if(e.touches.length>=2){
    touchState.pinch=true;touchState.moved=true;
    touchState.startDistance=touchDistance(e.touches[0],e.touches[1]);
    touchState.startZoom=zoom;
  }
},{passive:false});

canvas.addEventListener("touchmove",e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  if(e.touches.length===1&&!touchState.pinch){
    const t=e.touches[0],dx=t.clientX-touchState.lastX,dy=t.clientY-touchState.lastY;
    if(Math.abs(t.clientX-touchState.startX)>6||Math.abs(t.clientY-touchState.startY)>6)touchState.moved=true;
    offsetX+=dx;offsetY+=dy;touchState.lastX=t.clientX;touchState.lastY=t.clientY;draw();
  }else if(e.touches.length>=2){
    const a=e.touches[0],b=e.touches[1],c=touchCenter(a,b),d=touchDistance(a,b);
    if(!touchState.pinch){touchState.pinch=true;touchState.startDistance=d;touchState.startZoom=zoom}
    const oldZoom=zoom,ratio=d/touchState.startDistance;
    zoom=Math.max(.35,Math.min(2.5,touchState.startZoom*ratio));
    const cx=c.x-r.left,cy=c.y-r.top;
    offsetX=cx-(cx-offsetX)*(zoom/oldZoom);offsetY=cy-(cy-offsetY)*(zoom/oldZoom);
    touchState.moved=true;draw();
  }
},{passive:false});

canvas.addEventListener("touchend",e=>{
  e.preventDefault();
  if(!touchState.moved&&!touchState.pinch&&Date.now()-touchState.startTime<450){
    const t=e.changedTouches[0],r=canvas.getBoundingClientRect(),h=getHexAtMouse(t.clientX-r.left,t.clientY-r.top);
    if(!h){skillDetail.classList.remove("show")}
    else{
      if(h.state===0){if(isAvailable(h)){h.state=1;h.obtained=true}}
      else if(h.state===1){h.state=2;h.obtained=true}
      else{h.state=0;h.obtained=false}
      updateStatus();draw();
      detailName.textContent=h.name;
      detailText.textContent=`${h.filename} / ${h.state===1?"取得済み":h.state===2?"使用済み":isAvailable(h)?"取得可能":"未取得"}`;
      skillDetail.classList.add("show");
    }
  }
  if(e.touches.length===0){touchState.pinch=false}
  else if(e.touches.length===1){touchState.pinch=false;touchState.moved=true;touchState.lastX=e.touches[0].clientX;touchState.lastY=e.touches[0].clientY}
},{passive:false});

canvas.addEventListener("touchcancel",e=>{e.preventDefault();touchState.pinch=false},{passive:false});

canvas.addEventListener("mousedown",e=>{
  dragging=false;lastMouseX=e.clientX;lastMouseY=e.clientY;
  canvas.dataset.down="true";canvas.classList.add("dragging");
});
window.addEventListener("mousemove",e=>{
  if(canvas.dataset.down!=="true")return;
  const dx=e.clientX-lastMouseX,dy=e.clientY-lastMouseY;
  if(Math.abs(dx)>2||Math.abs(dy)>2)dragging=true;
  offsetX+=dx;offsetY+=dy;lastMouseX=e.clientX;lastMouseY=e.clientY;draw();
});
window.addEventListener("mouseup",()=>{
  canvas.dataset.down="false";canvas.classList.remove("dragging");
  setTimeout(()=>dragging=false,50);
});
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,old=zoom;
  zoom*=e.deltaY<0?1.1:1/1.1;zoom=Math.max(.35,Math.min(2.5,zoom));
  offsetX=mx-(mx-offsetX)*(zoom/old);offsetY=my-(my-offsetY)*(zoom/old);draw();
},{passive:false});

generateButton.addEventListener("click",()=>generateTree());
randomSeedButton.addEventListener("click",()=>{seedInput.value=randomSeed();generateTree()});
saveButton.addEventListener("click",saveProgress);
resetButton.addEventListener("click",resetProgress);

exportPngButton.addEventListener("click",async()=>{
  if(!hexes.length)return;

  // 現在の画面のズーム・移動位置は一切使わず、
  // ツリー自身の全ノード座標から画像サイズを決定します。
  // そのため、どれだけ拡大・移動していても必ず全体が入ります。
  const button=exportPngButton;
  const originalText=button.textContent;
  button.disabled=true;
  button.textContent="画像を生成中…";

  try{
    // 画像の読み込みがまだ終わっていない場合でも、
    // 生成時には全画像を待ってから描画します。
    await Promise.all(hexes.map(h=>{
      if(h.image.complete && h.image.naturalWidth>0)return Promise.resolve();
      return new Promise(resolve=>{
        const done=()=>{cleanup();resolve()};
        const cleanup=()=>{
          h.image.removeEventListener("load",done);
          h.image.removeEventListener("error",done);
        };
        h.image.addEventListener("load",done,{once:true});
        h.image.addEventListener("error",done,{once:true});
      });
    }));

    // 六角形の外周 + 線幅を確実に含める。
    const radius=HEX_SIZE;
    const strokeMargin=6;
    const padding=48;
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;

    for(const h of hexes){
      const p=hexToPixel(h.q,h.r);
      minX=Math.min(minX,p.x-radius-strokeMargin);
      maxX=Math.max(maxX,p.x+radius+strokeMargin);
      minY=Math.min(minY,p.y-radius-strokeMargin);
      maxY=Math.max(maxY,p.y+radius+strokeMargin);
    }

    const contentWidth=maxX-minX;
    const contentHeight=maxY-minY;

    // 基本は2倍解像度。巨大なツリーだけ自動的に縮小して、
    // スマホでもブラウザがCanvas上限で失敗しにくいようにします。
    const maxDimension=6000;
    const desiredScale=2;
    const autoScale=Math.min(
      desiredScale,
      maxDimension/(contentWidth+padding*2),
      maxDimension/(contentHeight+padding*2)
    );
    const exportScale=Math.max(0.5,autoScale);

    const width=Math.max(1,Math.ceil((contentWidth+padding*2)*exportScale));
    const height=Math.max(1,Math.ceil((contentHeight+padding*2)*exportScale));

    const exportCanvas=document.createElement("canvas");
    exportCanvas.width=width;
    exportCanvas.height=height;

    const ec=exportCanvas.getContext("2d");
    ec.setTransform(exportScale,0,0,exportScale,0,0);
    ec.imageSmoothingEnabled=true;
    ec.imageSmoothingQuality="high";
    ec.fillStyle="#0b1020";
    ec.fillRect(0,0,width/exportScale,height/exportScale);

    function exportPoint(x,y){
      return {x:x-minX+padding,y:y-minY+padding};
    }

    // 接続線を描画
    for(const h of hexes){
      const hp=hexToPixel(h.q,h.r);
      const p1=exportPoint(hp.x,hp.y);
      for(const np of getNeighbors(h.q,h.r)){
        const other=hexes.find(x=>x.q===np.q&&x.r===np.r);
        if(!other)continue;
        if(h.q>other.q||(h.q===other.q&&h.r>other.r))continue;

        const op=hexToPixel(other.q,other.r);
        const p2=exportPoint(op.x,op.y);
        ec.beginPath();
        ec.moveTo(p1.x,p1.y);
        ec.lineTo(p2.x,p2.y);
        const connected=h.obtained&&other.obtained;
        ec.strokeStyle=connected?"#637dff":"#26324d";
        ec.lineWidth=connected?4:2;
        ec.stroke();
      }
    }

    // 全ノードを描画
    for(const h of hexes){
      const wp=hexToPixel(h.q,h.r);
      const p=exportPoint(wp.x,wp.y);
      const size=HEX_SIZE;

      ec.save();
      ec.beginPath();
      for(let i=0;i<6;i++){
        const a=Math.PI/180*(60*i-30);
        const px=p.x+size*Math.cos(a);
        const py=p.y+size*Math.sin(a);
        if(i===0)ec.moveTo(px,py);else ec.lineTo(px,py);
      }
      ec.closePath();

      ec.fillStyle=h.state===1?"#3e65ff":h.state===2?"#b06cff":isAvailable(h)?"#263b73":"#151d33";
      ec.fill();

      if(h.image.complete&&h.image.naturalWidth>0){
        ec.save();
        ec.clip();
        const imageSize=size*1.58;
        const iw=h.image.naturalWidth,ih=h.image.naturalHeight;
        const imageScale=Math.max(imageSize/iw,imageSize/ih);
        ec.globalAlpha=h.obtained?1:.78;
        ec.drawImage(h.image,p.x-iw*imageScale/2,p.y-ih*imageScale/2,iw*imageScale,ih*imageScale);
        ec.restore();
      }

      ec.beginPath();
      for(let i=0;i<6;i++){
        const a=Math.PI/180*(60*i-30);
        const px=p.x+size*Math.cos(a);
        const py=p.y+size*Math.sin(a);
        if(i===0)ec.moveTo(px,py);else ec.lineTo(px,py);
      }
      ec.closePath();

      if(h.state===1){ec.strokeStyle="#7f9aff";ec.lineWidth=4}
      else if(h.state===2){ec.strokeStyle="#d8a8ff";ec.lineWidth=4}
      else if(isAvailable(h)){ec.strokeStyle="#5f78ff";ec.lineWidth=2.5}
      else{ec.strokeStyle="#38445f";ec.lineWidth=1.5}
      ec.stroke();
      ec.restore();
    }

    const dataUrl=exportCanvas.toDataURL("image/png");
    const tab=window.open("","_blank");
    if(!tab){
      alert("ポップアップを許可してください。");
      return;
    }
    tab.document.write(`<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill Tree</title><style>html,body{margin:0;background:#0b1020}body{display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px}img{display:block;width:auto;height:auto;max-width:none}</style></head><body><img src="${dataUrl}" alt="Skill Tree"></body></html>`);
    tab.document.close();
  }catch(error){
    console.error(error);
    alert("画像の生成に失敗しました。ツリーのサイズを少し小さくして、もう一度試してください。");
  }finally{
    button.disabled=false;
    button.textContent=originalText;
  }
});

resizeCanvas();
loadSkills();
</script>
</body>
</html>
