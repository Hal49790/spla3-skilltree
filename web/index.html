}

<body>

<div class="app">

    <aside class="sidebar">

        <div class="title">HEX SKILL TREE</div>
<div class="web-actions">
  <button id="saveButton">保存</button>
  <button id="postImageButton" class="secondary">Discordへ画像投稿</button>
  <button id="exportPngButton" class="secondary">画像生成</button>
</div>
</div>

        <div class="subtitle">
            六角形でつながるランダムスキルツリー<br>GitHub Pages対応・画像選択不要
        </div>

        <div class="asset-status" id="assetStatus">
            GitHub上の画像を自動読み込み中…
        </div>

        <label>
            生成するスキル数
        </label>

        <input
            id="countInput"
            type="number"
            min="1"
            max="181"
            value="60"
        >

        <button id="generateButton">
            スキルツリー生成
        </button>

        <button
            id="resetButton"
            class="secondary"
        >
            取得状態をリセット
        </button>

        <div class="status" id="status">
            スキルを入力してください。
        </div>

        <div class="info">
            <b>使い方</b><br>
            ・PNGフォルダを選択すると画像を自動登録<br>
            ・生成数を指定してスキルツリー生成<br><br>
            <b>操作方法</b><br>
            ・最初のスキルをクリックして取得<br>
            ・取得済みの隣のスキルを取得可能<br>
            ・マウスドラッグ：移動<br>
            ・ホイール：ズーム<br>
            ・スキルクリック：詳細表示
        </div>

    </aside>

    <main class="canvas-area">

        <canvas id="canvas"></canvas>

        <div class="top-info" id="topInfo">
            0 / 0
        </div>

        <div class="skill-detail" id="skillDetail">
            <h2 id="detailName"></h2>
            <p id="detailText"></p>
        </div>

    </main>

</div>


<script src="./config.js"></script>
<script>

/* =========================================================
   基本設定
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const countInput = document.getElementById("countInput");
const generateButton = document.getElementById("generateButton");
const resetButton = document.getElementById("resetButton");

const statusElement = document.getElementById("status");
const topInfo = document.getElementById("topInfo");

const skillDetail = document.getElementById("skillDetail");
const detailName = document.getElementById("detailName");
const detailText = document.getElementById("detailText");


/* =========================================================
   六角形設定
========================================================= */

const HEX_SIZE = 55;

const DIRECTIONS = [
    [1, 0],
    [1, -1],
    [0, -1],
    [-1, 0],
    [-1, 1],
    [0, 1]
];


/* =========================================================
   状態
   ========================================================= */

/*
 * GitHub Pages対応版。
 * 利用者が画像フォルダを選ぶ必要はありません。
 *
 * /skills.json に画像ファイル名を登録し、
 * /assets/skills/ に画像を置いてください。
 *
 * 画像ファイル名は連番である必要はありません。
 */

const IMAGE_MANIFEST = "./skills.json";
const IMAGE_BASE_PATH = "./assets/skills/";

let skillImages = [];
let hexes = [];

let zoom = 1.0;
let offsetX = 0;
let offsetY = 0;
let dragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

const assetStatus = document.getElementById("assetStatus");

async function loadSkillImages() {
    skillImages = [];

    try {
        const response = await fetch(IMAGE_MANIFEST, { cache: "no-store" });

        if (!response.ok) {
            throw new Error(`skills.json の読み込みに失敗しました (${response.status})`);
        }

        const manifest = await response.json();

        if (!Array.isArray(manifest) || manifest.length === 0) {
            throw new Error("skills.json に画像ファイルが登録されていません。");
        }

        const selectedManifest = manifest.slice(0, 181);

        assetStatus.textContent =
            `${selectedManifest.length}個のスキル画像を読み込み中…`;

        const results = await Promise.all(
            selectedManifest.map(async entry => {
                const filename =
                    typeof entry === "string" ? entry : entry.filename;

                const name =
                    typeof entry === "string"
                        ? entry.replace(/\.[^/.]+$/, "")
                        : (entry.name || filename.replace(/\.[^/.]+$/, ""));

                if (!filename) return null;

                const img = new Image();

                try {
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                        img.src = IMAGE_BASE_PATH +
                            encodeURIComponent(filename).replace(/%2F/g, "/");
                    });

                    return { name, image: img, filename };
                } catch {
                    console.warn("画像を読み込めませんでした:", filename);
                    return null;
                }
            })
        );

        skillImages = results.filter(Boolean);

        countInput.max = Math.max(1, skillImages.length);

        if (Number(countInput.value) > skillImages.length) {
            countInput.value = skillImages.length;
        }

        if (skillImages.length === 0) {
            throw new Error("画像を1枚も読み込めませんでした。");
        }

        assetStatus.className = "asset-status ok";
        assetStatus.textContent =
            `✓ ${skillImages.length}個のスキル画像を自動読み込みしました。`;

        statusElement.textContent =
            `候補 ${skillImages.length}個を読み込みました。`;

        generateTree();
        await loadProgressFromServer();

    } catch (error) {
        console.error(error);
        assetStatus.className = "asset-status error";
        assetStatus.textContent =
            "画像を読み込めませんでした。GitHubの /assets/skills/ と skills.json を確認してください。";
        statusElement.textContent = error.message;
    }
}


function resizeCanvas() {

    const rect = canvas.getBoundingClientRect();

    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    draw();
}

window.addEventListener("resize", resizeCanvas);


/* =========================================================
   六角座標
========================================================= */

function hexToPixel(q, r) {

    return {
        x: HEX_SIZE * Math.sqrt(3) * (q + r / 2),
        y: HEX_SIZE * 1.5 * r
    };
}


function hexKey(q, r) {
    return `${q},${r}`;
}


/* =========================================================
   隣接マス
========================================================= */

function getNeighbors(q, r) {

    return DIRECTIONS.map(([dq, dr]) => ({
        q: q + dq,
        r: r + dr
    }));
}


/* =========================================================
   スキルツリー生成
========================================================= */


function hashSeed(seed) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < seed.length; i++) {
        h ^= seed.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return h >>> 0;
}

function mulberry32(a) {
    return function() {
        a |= 0;
        a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

function randomSeed() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let s = "SPLA3-";
    const bytes = crypto.getRandomValues(new Uint8Array(6));
    for (const b of bytes) s += chars[b % chars.length];
    return s;
}

function seededShuffle(items, rng) {
    const a = [...items];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function generateTree() {

    if (skillImages.length === 0) {
        alert("PNG画像が読み込まれていません。");
        return;
    }

    /* -----------------------------
       生成数
    ----------------------------- */

    let seed = (document.getElementById("seedInput").value || "").trim().toUpperCase();

    if (!seed) {
        seed = randomSeed();
        document.getElementById("seedInput").value = seed;
    }

    const rng = mulberry32(hashSeed(seed));

    let count = Number(countInput.value);

    if (!Number.isInteger(count)) {
        count = 20;
    }

    count = Math.max(
        1,
        Math.min(count, skillImages.length, 181)
    );

    countInput.value = count;

    /* -----------------------------
       181個の候補からランダム選択
       同じ画像は重複しない
    ----------------------------- */

    const selected = seededShuffle(skillImages, rng).slice(0, count);

    /* -----------------------------
       六角形配置
       必ず既存マスの隣に追加する
       → 全体が必ず連結する
    ----------------------------- */

    hexes = [];

    const occupied = new Set();

    occupied.add(hexKey(0, 0));

    hexes.push({
        q: 0,
        r: 0,
        name: selected[0].name,
        image: selected[0].image,
        filename: selected[0].filename,
        obtained: false,
        state: 0
    });

    for (let i = 1; i < selected.length; i++) {

        const candidatesPositions = [];

        for (const hex of hexes) {

            const neighbors = getNeighbors(
                hex.q,
                hex.r
            );

            for (const pos of neighbors) {

                const key = hexKey(
                    pos.q,
                    pos.r
                );

                if (!occupied.has(key)) {
                    candidatesPositions.push(pos);
                }
            }
        }

        const unique = [];
        const seen = new Set();

        for (const pos of candidatesPositions) {

            const key = hexKey(
                pos.q,
                pos.r
            );

            if (!seen.has(key)) {
                seen.add(key);
                unique.push(pos);
            }
        }

        const pos =
            unique[
                Math.floor(
                    rng() * unique.length
                )
            ];

        occupied.add(
            hexKey(pos.q, pos.r)
        );

        hexes.push({
            q: pos.q,
            r: pos.r,
            name: selected[i].name,
            image: selected[i].image,
            filename: selected[i].filename,
            obtained: false,
            state: 0
        });
    }

    centerTree();
    updateStatus();
    draw();
}


/* =========================================================
   ツリーを画面中央へ
========================================================= */

function centerTree() {

    if (hexes.length === 0) {
        offsetX = 0;
        offsetY = 0;
        return;
    }

    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;

    for (const hex of hexes) {

        const p = hexToPixel(
            hex.q,
            hex.r
        );

        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x);

        minY = Math.min(minY, p.y);
        maxY = Math.max(maxY, p.y);
    }

    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;

    offsetX =
        canvas.clientWidth / 2 -
        centerX * zoom;

    offsetY =
        canvas.clientHeight / 2 -
        centerY * zoom;
}


/* =========================================================
   画面座標への変換
========================================================= */

function worldToScreen(x, y) {

    return {
        x: x * zoom + offsetX,
        y: y * zoom + offsetY
    };
}


/* =========================================================
   六角形描画
========================================================= */

function drawHex(x, y, size, hex) {

    ctx.save();

    ctx.beginPath();

    for (let i = 0; i < 6; i++) {

        const angle =
            Math.PI / 180 * (60 * i - 30);

        const px =
            x + size * Math.cos(angle);

        const py =
            y + size * Math.sin(angle);

        if (i === 0) {
            ctx.moveTo(px, py);
        } else {
            ctx.lineTo(px, py);
        }
    }

    ctx.closePath();

    /* -----------------------------
       背景色
    ----------------------------- */

    let fill;

    if (hex.state === 1) {
        fill = "#3e65ff";
    } else if (hex.state === 2) {
        fill = "#b06cff";
    } else if (isAvailable(hex)) {
        fill = "#263b73";
    } else {
        fill = "#151d33";
    }

    ctx.fillStyle = fill;
    ctx.fill();

    /* -----------------------------
       画像を六角形の内側に表示
    ----------------------------- */

    if (hex.image && hex.image.complete && hex.image.naturalWidth > 0) {

        ctx.save();
        ctx.clip();

        const imageSize = size * 1.58;
        const iw = hex.image.naturalWidth;
        const ih = hex.image.naturalHeight;

        const scale = Math.max(
            imageSize / iw,
            imageSize / ih
        );

        const drawW = iw * scale;
        const drawH = ih * scale;

        ctx.globalAlpha =
            hex.obtained ? 1.0 : 0.78;

        ctx.drawImage(
            hex.image,
            x - drawW / 2,
            y - drawH / 2,
            drawW,
            drawH
        );

        ctx.restore();
    }

    /* -----------------------------
       枠
    ----------------------------- */

    ctx.beginPath();

    for (let i = 0; i < 6; i++) {

        const angle =
            Math.PI / 180 * (60 * i - 30);

        const px =
            x + size * Math.cos(angle);

        const py =
            y + size * Math.sin(angle);

        if (i === 0) {
            ctx.moveTo(px, py);
        } else {
            ctx.lineTo(px, py);
        }
    }

    ctx.closePath();

    if (hex.state === 1) {

        ctx.strokeStyle = "#7f9aff";
        ctx.lineWidth = 4;

    } else if (hex.state === 2) {

        ctx.strokeStyle = "#d8a8ff";
        ctx.lineWidth = 4;

    } else if (isAvailable(hex)) {

        ctx.strokeStyle = "#5f78ff";
        ctx.lineWidth = 2.5;

    } else {

        ctx.strokeStyle = "#38445f";
        ctx.lineWidth = 1.5;
    }

    ctx.stroke();

    /*
     * 画像だけでは名前が分からないため、
     * 詳細表示は従来どおり画像ファイル名を使用。
     * 画面上にはテキストを重ねない。
     */

    ctx.restore();
}


/* =========================================================
   接続線
========================================================= */

function drawConnections() {

    for (const hex of hexes) {

        const p1 = hexToPixel(
            hex.q,
            hex.r
        );

        const screen1 =
            worldToScreen(
                p1.x,
                p1.y
            );

        const neighbors =
            getNeighbors(
                hex.q,
                hex.r
            );

        for (const pos of neighbors) {

            const other =
                hexes.find(
                    h =>
                        h.q === pos.q &&
                        h.r === pos.r
                );

            if (!other) continue;

            const p2 = hexToPixel(
                other.q,
                other.r
            );

            const screen2 =
                worldToScreen(
                    p2.x,
                    p2.y
                );

            /* 半分だけ描画する */

            if (
                hex.q > other.q ||
                (
                    hex.q === other.q &&
                    hex.r > other.r
                )
            ) {
                continue;
            }

            const connected =
                hex.obtained &&
                other.obtained;

            ctx.beginPath();

            ctx.moveTo(
                screen1.x,
                screen1.y
            );

            ctx.lineTo(
                screen2.x,
                screen2.y
            );

            ctx.strokeStyle =
                connected
                    ? "#637dff"
                    : "#26324d";

            ctx.lineWidth =
                connected ? 4 : 2;

            ctx.stroke();
        }
    }
}


/* =========================================================
   描画
========================================================= */

function draw() {

    if (!canvas.clientWidth) return;

    ctx.clearRect(
        0,
        0,
        canvas.clientWidth,
        canvas.clientHeight
    );

    drawConnections();

    for (const hex of hexes) {

        const p = hexToPixel(
            hex.q,
            hex.r
        );

        const screen =
            worldToScreen(
                p.x,
                p.y
            );

        drawHex(
            screen.x,
            screen.y,
            HEX_SIZE * zoom,
            hex
        );
    }
}


/* =========================================================
   取得可能か
========================================================= */

function isAvailable(hex) {

    /* 取得済み */

    if (hex.obtained) {
        return false;
    }

    /* 最初のスキル */

    const obtainedCount =
        hexes.filter(
            h => h.obtained
        ).length;

    if (obtainedCount === 0) {

        return hex === hexes[0];
    }

    /* 隣接する取得済みスキルがあるか */

    const neighbors =
        getNeighbors(
            hex.q,
            hex.r
        );

    return neighbors.some(
        pos =>
            hexes.some(
                h =>
                    h.q === pos.q &&
                    h.r === pos.r &&
                    h.obtained
            )
    );
}


/* =========================================================
   マウス位置からスキルを探す
========================================================= */

function getHexAtMouse(mouseX, mouseY) {

    for (let i = hexes.length - 1; i >= 0; i--) {

        const hex = hexes[i];

        const p = hexToPixel(
            hex.q,
            hex.r
        );

        const screen =
            worldToScreen(
                p.x,
                p.y
            );

        const dx =
            mouseX - screen.x;

        const dy =
            mouseY - screen.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (
            distance <=
            HEX_SIZE * zoom
        ) {
            return hex;
        }
    }

    return null;
}


/* =========================================================
   クリック
========================================================= */

canvas.addEventListener(
    "click",
    event => {

        if (dragging) return;

        const rect =
            canvas.getBoundingClientRect();

        const x =
            event.clientX - rect.left;

        const y =
            event.clientY - rect.top;

        const hex =
            getHexAtMouse(x, y);

        if (!hex) {

            skillDetail.classList.remove("show");

            return;
        }

        /*
          クリック状態
          0 = 未取得
          1 = 取得
          2 = 色変更
          次のクリックで 0 に戻る
        */

        if (hex.state === 0) {

            if (isAvailable(hex)) {

                hex.state = 1;
                hex.obtained = true;
            }

        } else if (hex.state === 1) {

            hex.state = 2;
            hex.obtained = true;

        } else {

            hex.state = 0;
            hex.obtained = false;
        }

        updateStatus();

        draw();

        detailName.textContent =
            hex.name;

        detailText.textContent =
            `${hex.filename} / ` +
            (
                hex.state === 1
                    ? "取得済み"
                    : hex.state === 2
                        ? "使用済み"
                        : isAvailable(hex)
                            ? "取得可能"
                            : "未取得"
            );

        skillDetail.classList.add("show");
    }
);

/* =========================================================
   画像生成（PNG書き出し）
========================================================= */

function generateSkillTreeImage() {

    // Canvasの現在の表示内容をそのまま高解像度PNGとして生成
    const scale = 2;

    const exportCanvas =
        document.createElement("canvas");

    exportCanvas.width =
        canvas.width * scale;

    exportCanvas.height =
        canvas.height * scale;

    const exportCtx =
        exportCanvas.getContext("2d");

    // 背景
    exportCtx.fillStyle = "#0b1020";
    exportCtx.fillRect(
        0,
        0,
        exportCanvas.width,
        exportCanvas.height
    );

    // 現在のcanvasを高解像度で描画
    exportCtx.drawImage(
        canvas,
        0,
        0,
        exportCanvas.width,
        exportCanvas.height
    );

    // 新しいタブを先に開く。
    // data:image/png を直接 window.open() に渡すと、
    // ブラウザによっては about:blank のままになるため、
    // 新しいタブのHTMLに画像として埋め込む。
    const newTab =
        window.open("", "_blank");

    if (!newTab) {
        alert("新しいタブを開けませんでした。ブラウザのポップアップブロックを確認してください。");
        return;
    }

    const imageUrl =
        exportCanvas.toDataURL("image/png");

    newTab.document.open();

    newTab.document.write(`
        <!doctype html>
        <html>
        <head>
            <meta charset="utf-8">
            <title>Skill Tree</title>
            <style>
                html, body {
                    margin: 0;
                    padding: 0;
                    background: #0b1020;
                    min-height: 100%;
                }
                body {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    overflow: auto;
                }
                img {
                    display: block;
                    max-width: 100vw;
                    height: auto;
                }
            </style>
        </head>
        <body>
            <img src="${imageUrl}" alt="Skill Tree">
        </body>
        </html>
    `);

    newTab.document.close();
}

const exportPngButton =
    document.getElementById("exportPngButton");

if (exportPngButton) {

    exportPngButton.addEventListener(
        "click",
        generateSkillTreeImage
    );
}



/* =========================================================
   ドラッグ
========================================================= */

canvas.addEventListener(
    "mousedown",
    event => {

        dragging = false;

        lastMouseX = event.clientX;
        lastMouseY = event.clientY;

        canvas.classList.add("dragging");

        canvas.dataset.down = "true";
    }
);

window.addEventListener(
    "mousemove",
    event => {

        if (
            canvas.dataset.down !== "true"
        ) return;

        const dx =
            event.clientX - lastMouseX;

        const dy =
            event.clientY - lastMouseY;

        if (
            Math.abs(dx) > 2 ||
            Math.abs(dy) > 2
        ) {
            dragging = true;
        }

        offsetX += dx;
        offsetY += dy;

        lastMouseX = event.clientX;
        lastMouseY = event.clientY;

        draw();
    }
);

window.addEventListener(
    "mouseup",
    () => {

        canvas.dataset.down = "false";

        canvas.classList.remove("dragging");

        setTimeout(
            () => {
                dragging = false;
            },
            50
        );
    }
);


/* =========================================================
   ズーム
========================================================= */

canvas.addEventListener(
    "wheel",
    event => {

        event.preventDefault();

        const rect =
            canvas.getBoundingClientRect();

        const mouseX =
            event.clientX - rect.left;

        const mouseY =
            event.clientY - rect.top;

        const oldZoom = zoom;

        if (event.deltaY < 0) {

            zoom *= 1.1;

        } else {

            zoom /= 1.1;
        }

        zoom =
            Math.max(
                0.35,
                Math.min(2.5, zoom)
            );

        /* マウス位置を中心にズーム */

        offsetX =
            mouseX -
            (mouseX - offsetX) *
            (zoom / oldZoom);

        offsetY =
            mouseY -
            (mouseY - offsetY) *
            (zoom / oldZoom);

        draw();
    },
    { passive: false }
);


/* =========================================================
   リセット
========================================================= */

resetButton.addEventListener(
    "click",
    () => {

        for (const hex of hexes) {

            hex.obtained = false;
            hex.state = 0;
        }

        skillDetail.classList.remove("show");

        updateStatus();

        draw();
    }
);


/* =========================================================
   ステータス
========================================================= */

function updateStatus() {

    const obtained =
        hexes.filter(
            h => h.obtained
        ).length;

    statusElement.textContent =
        `候補 ${skillImages.length}個 / ${hexes.length}個を生成しました`;

    topInfo.textContent =
        `${obtained} / ${hexes.length} 取得`;
}


/* =========================================================
   生成ボタン
========================================================= */

generateButton.addEventListener(
    "click",
    generateTree
);


/* =========================================================
   初期化
========================================================= */

resizeCanvas();

loadSkillImages();


/* =========================================================
   Discord / API連携
   ========================================================= */

const API_BASE = window.SKILLTREE_API_BASE || "";

function currentSeed() {
    return (document.getElementById("seedInput").value || "").trim().toUpperCase();
}

async function apiFetch(path, options = {}) {
    const res = await fetch(API_BASE + path, {
        ...options,
        headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
        }
    });
    if (!res.ok) {
        const text = await res.text();
        throw new Error(text || `API error: ${res.status}`);
    }
    return res.json();
}

function getProgress() {
    return hexes.map((hex, index) => ({
        index,
        q: hex.q,
        r: hex.r,
        state: hex.state,
        obtained: hex.obtained,
        filename: hex.filename
    }));
}

function applyProgress(progress) {
    if (!Array.isArray(progress)) return;
    const byIndex = new Map(progress.map(x => [Number(x.index), x]));
    hexes.forEach((hex, index) => {
        const p = byIndex.get(index);
        if (!p) return;
        hex.state = Number(p.state) || 0;
        hex.obtained = !!p.obtained;
    });
    updateStatus();
    draw();
}

async function loadProgressFromServer() {
    const seed = currentSeed();
    if (!seed) return;
    try {
        const data = await apiFetch(`/api/trees/${encodeURIComponent(seed)}`);
        if (data && data.progress) {
            applyProgress(data.progress);
            statusElement.textContent = `保存済みの取得状況を読み込みました。`;
        }
    } catch (e) {
        console.warn("progress load:", e);
    }
}

async function saveProgress() {
    const seed = currentSeed();
    if (!seed) return;
    try {
        const data = await apiFetch("/api/progress", {
            method: "POST",
            body: JSON.stringify({
                seed,
                progress: getProgress()
            })
        });
        statusElement.textContent =
            `✓ 保存しました（${new Date().toLocaleTimeString("ja-JP")}）`;
        return data;
    } catch (e) {
        console.error(e);
        alert("保存に失敗しました。\n" + e.message);
    }
}

async function postCurrentImageToDiscord() {
    const seed = currentSeed();
    if (!seed) return;

    const blob = await makePngBlob();
    const form = new FormData();
    form.append("seed", seed);
    form.append("image", blob, `skilltree-${seed}.png`);

    try {
        const res = await fetch(API_BASE + "/api/discord/post-image", {
            method: "POST",
            body: form
        });
        if (!res.ok) throw new Error(await res.text());
        statusElement.textContent = "✓ Discordへ画像を投稿しました。";
    } catch (e) {
        console.error(e);
        alert("Discordへの画像投稿に失敗しました。\n" + e.message);
    }
}

function makePngBlob() {
    return new Promise(resolve => {
        const scale = 2;
        const exportCanvas = document.createElement("canvas");
        exportCanvas.width = canvas.width * scale;
        exportCanvas.height = canvas.height * scale;
        const exportCtx = exportCanvas.getContext("2d");
        exportCtx.fillStyle = "#0b1020";
        exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
        exportCtx.drawImage(canvas, 0, 0, exportCanvas.width, exportCanvas.height);
        exportCanvas.toBlob(resolve, "image/png");
    });
}

document.getElementById("saveButton").addEventListener("click", saveProgress);
document.getElementById("postImageButton").addEventListener("click", postCurrentImageToDiscord);

document.getElementById("loadSeedButton").addEventListener("click", async () => {
    const seed = currentSeed();
    if (!seed) return alert("シード値を入力してください。");
    generateTree();
    await loadProgressFromServer();
});

</script>
